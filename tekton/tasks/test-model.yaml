apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-model-task
spec:
  params:
    - name: python-image
      type: string
      default: python:3.12-slim
    - name: min-coverage
      type: string
      default: "80"
  workspaces:
    - name: source
      description: Workspace partagé contenant le code source cloné
  steps:
    - name: run-tests
      image: $(params.python-image)
      workingDir: $(workspaces.source.path)/model-code
      script: |
        #!/bin/sh
        set -e
        pip install --no-cache-dir -r requirements-test.txt
        python -m pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-fail-under=$(params.min-coverage)
