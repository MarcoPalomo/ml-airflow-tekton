[pytest]
# Configuration pytest pour le projet ML Airflow Tekton

# Répertoires à analyser pour les tests
testpaths = tests

# Pattern pour découvrir les fichiers de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    # Afficher un résumé détaillé
    -ra
    # Afficher les warnings
    --strict-markers
    # Désactiver les warnings de dépendances tierces
    --disable-warnings
    # Temps d'exécution des tests les plus lents
    --durations=10
    # Afficher la progression en pourcentage
    --tb=short

# Marqueurs personnalisés
markers =
    unit: Tests unitaires rapides
    integration: Tests d'intégration (plus lents)
    slow: Tests lents (>1s)
    api: Tests de l'API FastAPI
    preprocessing: Tests du module preprocessing
    training: Tests du module training
    airflow: Tests des fonctions Airflow
    requires_mlflow: Tests nécessitant MLflow
    requires_db: Tests nécessitant une base de données

# Configuration de la couverture de code
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    setup.py

[coverage:report]
# Exclure certains patterns du rapport
exclude_lines =
    # Exclure les lignes pragma
    pragma: no cover
    # Exclure les définitions de méthodes abstraites
    def __repr__
    def __str__
    # Exclure les raise NotImplementedError
    raise NotImplementedError
    # Exclure les blocs if __name__ == '__main__'
    if __name__ == .__main__.:
    # Exclure les pass
    pass
    # Exclure les imports conditionnels de type checking
    if TYPE_CHECKING:
    # Exclure les ellipsis
    \.\.\.

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
