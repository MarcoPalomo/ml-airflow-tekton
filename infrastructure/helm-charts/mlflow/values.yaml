# MLflow configuration
#
# ⚠️  DEV / DÉMO UNIQUEMENT — les mots de passe en clair (postgresqlPassword)
# doivent être remplacés par un Secret Kubernetes en production.
# Les credentials AWS et le mot de passe admin sont injectés au déploiement
# via un fichier de values temporaire (cf. `make install-mlflow`), jamais en --set.
# Voir SECURITY.md (Option A : Kubernetes Secrets).
mlflow:
  # Enable or disable the MLflow server
  enabled: true
  
  # MLflow server configuration
  server:
    # Service configuration
    service:
      type: ClusterIP
      port: 5000
    
    # Ingress configuration
    ingress:
      enabled: true
      hostname: mlflow.example.com
      annotations:
        kubernetes.io/ingress.class: nginx
      
    # Database configuration (PostgreSQL)
    backendStore:
      postgresql:
        enabled: true
        postgresqlUsername: mlflow
        postgresqlPassword: "mlflow-password"
        postgresqlDatabase: mlflow
    
    # Artifact storage (S3)
    artifactRoot: s3://mlflow/artifacts
    
    # AWS credentials for S3 access
    aws:
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      region: ${AWS_DEFAULT_REGION}
    
    # Authentication (basic auth)
    auth:
      enabled: true
      username: admin
      password: ${MLFLOW_ADMIN_PASSWORD}

# PostgreSQL configuration
postgresql:
  enabled: true
  postgresqlUsername: mlflow
  postgresqlPassword: "mlflow-password"
  postgresqlDatabase: mlflow
  persistence:
    enabled: true
    size: 10Gi

# Redis configuration (for async operations)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
