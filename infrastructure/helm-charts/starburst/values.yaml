# Starburst Enterprise Platform configuration
starburst:
  # Enable or disable the Starburst deployment
  enabled: true

  # Image configuration
  image:
    repository: starburstdata/starburst-enterprise
    tag: 402.0.0
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    ports:
      http: 8080
      jmx: 8004
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: true
    hostname: starburst.example.com
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

  # Coordinator configuration
  coordinator:
    replicas: 1
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
    
    config:
      # JVM configuration
      jvm:
        maxHeapSize: "8G"
        gcMethod:
          type: "UseG1GC"
      
      # Coordinator specific configuration
      coordinator: true
      node-scheduler.include-coordinator: false
      http-server.http.port: 8080
      discovery-server.enabled: true
      discovery.uri: "http://localhost:8080"

  # Worker configuration
  worker:
    replicas: 2
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "32Gi"
    
    config:
      # JVM configuration
      jvm:
        maxHeapSize: "12G"
        gcMethod:
          type: "UseG1GC"
      
      # Worker specific configuration
      coordinator: false
      http-server.http.port: 8080
      discovery.uri: "http://${HOSTNAME_PREFIX}coordinators.${NAMESPACE}.svc.cluster.local:8080"

  # Catalog configuration
  catalogs:
    # Hive connector
    hive:
      connector.name: hive
      hive.metastore.uri: "thrift://hive-metastore:9083"
      hive.s3.aws-access-key: ${AWS_ACCESS_KEY_ID}
      hive.s3.aws-secret-key: ${AWS_SECRET_ACCESS_KEY}
      hive.s3.region: ${AWS_DEFAULT_REGION}
    
    # PostgreSQL connector
    postgresql:
      connector.name: postgresql
      connection-url: jdbc:postgresql://postgresql:5432/postgres
      connection-user: postgres
      connection-password: ${POSTGRES_PASSWORD}

  # Authentication
  auth:
    type: password
    ldap:
      enabled: false
    password:
      enabled: true
      authenticator: "password"
      password.authenticator.files.password-file: "/etc/starburst/password.db"
      password.authentication.allow-insecure-http: "true"

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
