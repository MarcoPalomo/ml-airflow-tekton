# Configuration Airflow simplifiée pour installation rapide
#
# ⚠️  DEV / DÉMO UNIQUEMENT — ne pas utiliser tel quel en production.
# Les mots de passe ci-dessous (postgres, admin) sont des valeurs par défaut.
# En production : créer un Secret Kubernetes et référencer
#   postgresql.auth.existingSecret et un Secret pour l'utilisateur webserver.
# Voir SECURITY.md (Option A : Kubernetes Secrets).
executor: KubernetesExecutor

# Désactiver les fonctionnalités non essentielles pour accélérer l'installation
redis:
  enabled: false  # Pas nécessaire avec KubernetesExecutor

# Configuration PostgreSQL optimisée
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: postgres
  primary:
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# Utilisateur par défaut + réplicas réduits pour accélérer le démarrage
webserver:
  replicas: 1
  defaultUser:
    enabled: true
    username: admin
    password: admin
    email: admin@example.com
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Scheduler optimisé
scheduler:
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Désactiver le triggerer (pas nécessaire pour démarrer)
triggerer:
  enabled: false

# Workers (non utilisé avec KubernetesExecutor)
workers:
  enabled: false

# Configuration de la migration de DB
migrateDatabaseJob:
  enabled: true
  jobAnnotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"

# Configuration des DAGs
dags:
  persistence:
    enabled: false  # Simplifier pour l'installation initiale
  gitSync:
    enabled: false

# Configuration des logs
logs:
  persistence:
    enabled: false  # Simplifier pour l'installation initiale
